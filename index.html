const STORE='sk.unlock.'+P.salt.slice(0,12);
const b64=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
async function play(k){const raw=b64(P.data),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},k,raw.slice(12));
 const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
async function fromPassword(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
 const saved=localStorage.getItem(STORE);
 if(saved){try{const k=await crypto.subtle.importKey('raw',b64(saved),{name:'AES-GCM'},false,['decrypt']);await play(k);return;}catch(e){localStorage.removeItem(STORE);}}
 const g=document.getElementById('gate');g.hidden=false;const f=document.getElementById('box'),msg=document.getElementById('msg'),pw=document.getElementById('pw');
 f.onsubmit=async ev=>{ev.preventDefault();msg.textContent='Unlocking...';
  try{const k=await fromPassword(pw.value);const raw=await crypto.subtle.exportKey('raw',k);
   localStorage.setItem(STORE,btoa(String.fromCharCode(...new Uint8Array(raw))));await play(k);}
  catch(e){localStorage.removeItem(STORE);msg.textContent='That password is not right.';pw.select();}};
})();
})();

const STORE='sk.unlock.'+P.salt.slice(0,12);
const b64=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
async function unseal(k){const raw=b64(P.data),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},k,raw.slice(12));return new TextDecoder().decode(pt);}
function play(html){document.open();document.write(html);document.close();}
async function fromPassword(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
 let saved=null;try{saved=localStorage.getItem(STORE);}catch(e){}
 if(saved&&window.crypto&&crypto.subtle){let html=null;try{html=await unseal(await crypto.subtle.importKey('raw',b64(saved),{name:'AES-GCM'},false,['decrypt']));}catch(e){try{localStorage.removeItem(STORE);}catch(e2){}}
  if(html!==null){play(html);return;}}
 const g=document.getElementById('gate');g.hidden=false;const f=document.getElementById('box'),msg=document.getElementById('msg'),pw=document.getElementById('pw');
 f.onsubmit=async ev=>{ev.preventDefault();
  if(!(window.crypto&&crypto.subtle)){msg.textContent='This browser cannot unlock the game. Open the link in Safari or Chrome.';return;}
  msg.textContent='Unlocking...';
  // phone keyboards add a capital first letter, a trailing space, curly quotes or long dashes on their own, so those slips are tried too
  const t=pw.value,n=t.normalize('NFKC').replace(/[‘’‛′]/g,"'").replace(/[“”″]/g,'"').replace(/—/g,'--').replace(/–/g,'-').trim();
  const tries=[...new Set([t,t.trim(),n,n.charAt(0).toLowerCase()+n.slice(1),n.charAt(0).toUpperCase()+n.slice(1),n.toLowerCase()])].filter(Boolean);
  let k=null,html=null;
  for(const c of tries){try{const kk=await fromPassword(c);html=await unseal(kk);k=kk;break;}catch(e){}}
  if(!k){try{localStorage.removeItem(STORE);}catch(e){}msg.textContent='That password is not right.';pw.select();return;}
  try{const raw=await crypto.subtle.exportKey('raw',k);localStorage.setItem(STORE,btoa(String.fromCharCode(...new Uint8Array(raw))));}catch(e){} // private browsing: play anyway, just ask again next time
  play(html);};
